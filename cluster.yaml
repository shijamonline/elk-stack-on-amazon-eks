apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: elk-lab
  region: ap-southeast-2

iam:
  withOIDC: true

managedNodeGroups:
  - name: workers
    instanceType: m7i-flex.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 4
    volumeSize: 50

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
